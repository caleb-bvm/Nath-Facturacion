ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html
</Directory>

# Archivos internos: nunca servir configuración, bibliotecas ni utilidades CLI.
<DirectoryMatch "^/var/www/html/(config|database|vendor)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
