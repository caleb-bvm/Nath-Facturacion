name: facturacion

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      FACTURACION_DB_HOST: db
      FACTURACION_DB_NAME: ${FACTURACION_DB_NAME:-facturacion_db}
      FACTURACION_DB_USER: ${FACTURACION_DB_USER:-facturacion}
      FACTURACION_DB_PASS: ${FACTURACION_DB_PASS:?Configure FACTURACION_DB_PASS en .env}
      FACTURACION_COOKIE_SECURE: ${FACTURACION_COOKIE_SECURE:-0}
      FACTURACION_SMTP_HOST: ${FACTURACION_SMTP_HOST:-}
      FACTURACION_SMTP_PUERTO: ${FACTURACION_SMTP_PUERTO:-465}
      FACTURACION_SMTP_CIFRADO: ${FACTURACION_SMTP_CIFRADO:-ssl}
      FACTURACION_SMTP_AUTH: ${FACTURACION_SMTP_AUTH:-LOGIN}
      FACTURACION_SMTP_USUARIO: ${FACTURACION_SMTP_USUARIO:-}
      FACTURACION_SMTP_CLAVE: ${FACTURACION_SMTP_CLAVE:-}
      FACTURACION_CORREO_REMITENTE: ${FACTURACION_CORREO_REMITENTE:-}
      FACTURACION_CORREO_JEFE: ${FACTURACION_CORREO_JEFE:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sesiones:/var/lib/php/sessions
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${FACTURACION_DB_NAME:-facturacion_db}
      MYSQL_USER: ${FACTURACION_DB_USER:-facturacion}
      MYSQL_PASSWORD: ${FACTURACION_DB_PASS:?Configure FACTURACION_DB_PASS en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_datos:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT id FROM configuracion_correo LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_datos:
  sesiones:
